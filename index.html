<head>

    <title>地球Online：22岁玩家的埃及航海志 📚</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper-cream: #F4EFE6;
            --paper-white: #FFFFFF;
            --kraft-paper: #D9C5B2;
            --ocean-blue: #1C5169;
            --desert-gold: #DCA046;
            --ink-black: #1E1E1E;
            --tape-clear: rgba(220, 160, 70, 0.2);
            --tape-blue: rgba(28, 81, 105, 0.25);
            --neon-red: #FF3B30;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #C2B8AA;
            font-family: 'Noto Serif SC', serif;
            color: var(--ink-black);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 0;
            overflow-x: hidden;
        }

        /* 宇宙大容器：横向丝滑滚动 */
        .zine-universe {
            display: flex;
            gap: 60px;
            padding: 20px 40px;
            overflow-x: scroll;
            width: 100vw;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
        }

        /* 跨页（Spread）：模拟 1280x720 的实体书展开效果 */
        .zine-spread {
            flex: 0 0 1280px;
            height: 720px;
            background-color: var(--paper-cream);
            box-shadow: 5px 20px 50px rgba(0,0,0,0.25);
            display: flex;
            position: relative;
            scroll-snap-align: center;
            overflow: hidden;
        }

        /* 书脊中缝阴影线 */
        .zine-spread::after {
            content: '';
            position: absolute;
            left: 50%; top: 0; width: 4px; height: 100%;
            background: linear-gradient(to right, rgba(0,0,0,0.15), transparent, rgba(0,0,0,0.15));
            z-index: 99;
        }

        /* 单页布局 */
        .zine-page {
            width: 50%; height: 100%; padding: 50px;
            position: relative; display: flex; flex-direction: column;
            justify-content: space-between; overflow: hidden;
        }

        /* --- 20794手帐核心样式复刻 --- */
        
        /* 1. 拍立得照片外框 */
        .polaroid {
            background: var(--paper-white);
            padding: 12px 12px 36px 12px;
            box-shadow: 4px 10px 25px rgba(0,0,0,0.12);
            border-radius: 1px;
            display: inline-block;
            transition: transform 0.3s ease;
        }
        .polaroid img { width: 100%; height: 100%; object-fit: cover; }

        /* 2. 透明胶带装饰 */
        .washi-tape {
            position: absolute; width: 100px; height: 26px;
            background: var(--tape-clear); transform: rotate(-10deg);
            z-index: 10; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.05));
            border-left: 2px dashed rgba(0,0,0,0.05); border-right: 2px dashed rgba(0,0,0,0.05);
        }

        /* 3. 撕裂纸张色块背景 */
        .torn-paper {
            background: var(--kraft-paper);
            padding: 20px;
            position: relative;
            box-shadow: 2px 5px 15px rgba(0,0,0,0.08);
            border-left: 3px dashed rgba(255,255,255,0.5);
        }

        /* 4. 圆形掩膜裁剪 */
        .circle-photo {
            border-radius: 50%; overflow: hidden;
            border: 6px solid var(--paper-white);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        /* 排版字体规范 */
        h1.main-title { font-size: 56px; font-weight: 900; line-height: 1.1; letter-spacing: -1px; color: var(--ink-black); }
        h2.page-heading { font-size: 32px; font-weight: 900; line-height: 1.3; margin-bottom: 15px; }
        p.handwrite-text { font-size: 15px; line-height: 1.8; color: #3A3A3A; white-space: pre-line; font-weight: 500; }
        .pixel-font { font-family: 'VT323', monospace; font-size: 18px; color: var(--neon-red); }

        /* 错位控制类 */
        .overlap-top { z-index: 20; }
        .rot-left { transform: rotate(-3deg); }
        .rot-right { transform: rotate(4deg); }
        
        .scroll-tip { text-align: center; margin-top: 20px; font-size: 14px; color: #555; animation: horizontal-wave 2s infinite; }
        @keyframes horizontal-wave { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(15px); } }
    </style>
</head>
